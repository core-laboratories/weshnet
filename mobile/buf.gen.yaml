version: v2
plugins:
  - local: protoc-gen-go
    out: ./
    opt:
      - module=github.com/core-laboratories/weshnet/mobile/v2
      - Mprotocoltypes.proto=github.com/core-laboratories/weshnet/v2/pkg/protocoltypes
  - local: protoc-gen-go-grpc
    out: ./
    opt:
      - module=github.com/core-laboratories/weshnet/mobile/v2
      - Mprotocoltypes.proto=github.com/core-laboratories/weshnet/v2/pkg/protocoltypes
  - local: protoc-gen-grpc-gateway
    out: ./
    opt:
      - module=github.com/core-laboratories/weshnet/mobile/v2
      - Mprotocoltypes.proto=github.com/core-laboratories/weshnet/v2/pkg/protocoltypes
      - generate_unbound_methods=true
