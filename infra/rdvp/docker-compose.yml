services:
  rdvp:
    image: ${RDVP_IMAGE:-weshnet-rdvp-not-configured}
    restart: unless-stopped
    environment:
      RDVP_PK: ${RDVP_PK:-}
      EMITTER_SECRET_KEY: ${EMITTER_SECRET_KEY:-}
    entrypoint: rdvp
    depends_on:
      emitter:
        condition: service_started
    ports:
      - "4040:4040/tcp"
      - "4040:4040/udp"
    command:
      - serve
      - "-log.format=json"
      - "-log.filters=debug+:*"
      - "--db=:memory:"
      - "--pk=$RDVP_PK"
      - "-metrics=:8888"
      - "-l=/ip4/0.0.0.0/tcp/4040,/ip4/0.0.0.0/udp/4040/quic-v1"
      - "-announce=/ip4/${ANNOUNCE_SERVER}/tcp/4040,/ip4/${ANNOUNCE_SERVER}/udp/4040/quic-v1"
      - "-emitter-admin-key=$EMITTER_SECRET_KEY"
      - "-emitter-public-addr=tcp://${ANNOUNCE_SERVER}:9494"
      - "-emitter-server=tcp://emitter:9494"

  emitter:
    image: emitter/server:v3.1
    restart: unless-stopped
    ports:
      - "9494:9494/tcp"
    environment:
      EMITTER_LICENSE: ${EMITTER_LICENSE:-}
      EMITTER_LISTEN: ":9494"
