name: Go

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["**", "!**.md", "go.*", "**.go", ".github/workflows/go.yml"]
  pull_request:
    paths: ["**", "!**.md", "go.*", "**.go", ".github/workflows/go.yml"]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci-lint:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  flappy-tests:
    name: Flappy tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Avoid triggering make generate
        run: touch gen.sum
      - name: Fetch Go modules
        run: go mod download
      - name: Compile the testing binary
        run: go test -c -o ./tests.bin .
      - name: Check go.mod and go.sum
        run: |
          go mod tidy -v
          git --no-pager diff go.mod go.sum
          git --no-pager diff --quiet go.mod go.sum
      - name: Run fast flappy tests
        env:
          TEST_SPEED: fast
          TEST_STABILITY: flappy
        run: make go.flappy-tests

  stable-tests:
    name: Stable tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check go.mod and go.sum
        shell: bash
        run: |
          go mod tidy -v
          git --no-pager diff go.mod go.sum
          git --no-pager diff --quiet go.mod go.sum
      - name: Run fast tests multiple times
        if: runner.os == 'Windows'
        env:
          TEST_SPEED: fast
        run: go test ./... -buildmode=exe -timeout=600s -count=5
      - name: Run fast tests
        if: runner.os != 'Windows'
        env:
          TEST_SPEED: fast
          GO_TEST_OPTS: -test.timeout=600s -count=1
        run: set -o pipefail; make go.unittest | tee test_log.txt
      - name: Run all tests on Windows
        if: runner.os == 'Windows'
        env:
          TEST_SPEED: any
        run: go test ./... -buildmode=exe -timeout=600s -count=1
      - name: Run all tests
        if: runner.os != 'Windows'
        env:
          TEST_SPEED: any
          GO_TEST_OPTS: -test.timeout=600s -count=1
        run: make go.unittest
      - name: Run race tests and collect coverage
        if: runner.os != 'Windows'
        env:
          TEST_SPEED: any
          GO_TEST_OPTS: -test.timeout=1200s -count=1 -race -cover -coverprofile=coverage.txt -covermode=atomic
        run: make go.unittest
      - name: Upload coverage to Codecov
        if: runner.os != 'Windows'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.txt
          flags: go.unittests
          name: codecov-${{ runner.os }}
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
