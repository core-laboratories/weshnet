name: Release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
on:
  release:
    types: [published]

jobs:
  index-go-module:
    name: Index published Go release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Request release from Go module proxy
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package=$(go list -m)
          curl --fail --show-error --silent --retry 5 --retry-delay 3 --retry-all-errors \
            "https://proxy.golang.org/${package}/@v/${RELEASE_TAG}.info"
