name: Dependent Issues

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: "42 2 * * *"

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: dependent-issues-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check dependent issues
        uses: z0al/dependent-issues@950226e7ca8fc43dc209a7febf67c655af3bdb43 # v1.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          label: dependent
          check_issues: "off"
          keywords: depends on, blocked by
