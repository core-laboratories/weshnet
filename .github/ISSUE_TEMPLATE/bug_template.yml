name: Bug report
description: Report reproducible incorrect behavior in Weshnet
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Weshnet. Do not report security
        vulnerabilities here; use the process in SECURITY.md instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report does not contain secrets, private keys, recovery material, or private message content.
          required: true

  - type: input
    id: version
    attributes:
      label: Weshnet version
      description: Provide a release tag or commit SHA.
      placeholder: v2.x.x or 0123456789abcdef
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS version, architecture, Go version, integration type, and relevant transport configuration.
      placeholder: |
        OS: macOS 15
        Architecture: arm64
        Go: go1.x
        Integration: Go service / mobile binding / gRPC client
        Transports: TCP, QUIC, BLE, Nearby, ...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Clearly describe the incorrect behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the problem.
      placeholder: |
        1. Create a service with ...
        2. Connect peers using ...
        3. Call ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized logs, errors, stack traces, or a minimal code sample when useful.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any relevant timing, network topology, regression range, or workaround.
