name: Feature request
description: Propose a focused improvement to Weshnet
title: "feature: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Preflight checks
      options:
        - label: I searched existing issues and documentation for this proposal.
          required: true
        - label: This request is for Weshnet rather than application-specific user interface behavior.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain the concrete limitation, who encounters it, and why existing APIs are insufficient.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and public API from a caller's perspective.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Protocol API
        - Messaging and replication
        - Discovery and rendezvous
        - Networking and transports
        - Identity and credentials
        - Storage
        - Mobile bindings
        - Developer tooling
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and privacy
      description: Describe effects on protocol compatibility, stored data, network behavior, metadata exposure, and privacy. Write "None" if there are none.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain existing workarounds or other designs you considered.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add sketches, API examples, related specifications, or implementation notes.
